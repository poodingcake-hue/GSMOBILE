name: Sync Google Sheets Data

on:
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Sync Google Sheets to CSV
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python -X utf8 sync_sheets.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        mkdir -p web-app/public/data/
        git add web-app/public/data/ || echo "Nothing to stage"
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Auto-update CSV data files from Google Sheets [skip ci]"
          git pull --rebase origin main
          git push
        fi
