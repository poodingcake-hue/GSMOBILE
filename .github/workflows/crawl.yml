name: GS SHOP Mobile Live Crawler

on:
  schedule:
    # 매일 한국 시간 아침 8:00 ~ 저녁 9:00까지 1시간 간격으로 스케줄링 (UTC 23:00, 0:00 ~ 12:00)
    # 실제 실행 시간은 아래 Random Delay 스텝에 의해 매번 0~20분 사이로 지연됩니다.
    - cron: '0 23,0-12 * * *'
  workflow_dispatch:
    # 깃허브 웹에서 수동으로 즉시 구동할 수 있도록 지원

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium gspread google-auth

    - name: Install Chrome and Driver
      # ubuntu-latest에는 Chrome 브라우저가 기본 설치되어 있으므로, 
      # 별도 설치 없이 headless 모드로 바로 사용 가능합니다.
      run: |
        google-chrome --version
        chromedriver --version

    - name: Random Delay (Bot Evasion)
      run: |
        # 0 ~ 1200초(20분) 사이의 랜덤 딜레이를 주어 크롤링 간격을 40~80분(평균 60분)으로 다변화합니다.
        DELAY=$((RANDOM % 1200))
        echo "Sleeping for $DELAY seconds to randomize access time..."
        sleep $DELAY

    - name: Run Crawler
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python -X utf8 crawl_gsshop.py

    - name: Sync Google Sheets to CSV
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python -X utf8 sync_sheets.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        mkdir -p web-app/public/data/
        git add web-app/public/data/
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update data files from Google Sheets"
        fi
        git stash --include-untracked || true
        git pull --rebase origin main || git pull origin main
        git stash pop || true
        git push

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'web-app/package-lock.json'

    - name: Install Node dependencies
      working-directory: ./web-app
      run: npm ci

    - name: Build Vite App
      working-directory: ./web-app
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web-app/dist
