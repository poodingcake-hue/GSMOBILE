name: GS SHOP Mobile Live Crawler

on:
  schedule:
    # 매일 한국 시간 오전 9:00 ~ 오후 8:00까지 20분 간격으로 자동 구동 (UTC 0:00 ~ 11:00)
    - cron: '*/20 0-10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    # 깃허브 웹에서 수동으로 즉시 구동할 수 있도록 지원

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium gspread google-auth

    - name: Install Chrome and Driver
      # ubuntu-latest에는 Chrome 브라우저가 기본 설치되어 있으므로, 
      # 별도 설치 없이 headless 모드로 바로 사용 가능합니다.
      run: |
        google-chrome --version
        chromedriver --version

    - name: Run Crawler
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python -X utf8 crawl_gsshop.py

    - name: Sync Google Sheets to CSV
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python -X utf8 sync_sheets.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        mkdir -p web-app/public/data/
        git add web-app/public/data/
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update data files from Google Sheets"
        fi
        git stash --include-untracked || true
        git pull --rebase origin main || git pull origin main
        git stash pop || true
        git push
